services:

  redis:
    image: redis
    container_name: solvix-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - solvix-network
    restart: unless-stopped

volumes:
  redis_data:

networks:
  solvix-network:
    driver: bridge