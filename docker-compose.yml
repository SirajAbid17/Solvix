services:

  mongo:
    image: mongo:7
    container_name: solvix-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - solvix-network

  redis:
    image: redis:7-alpine
    container_name: solvix-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - solvix-network

  auth:
    build:
      context: ./backend
      dockerfile: services/auth/Dockerfile
    container_name: solvix-auth
    restart: unless-stopped
    env_file:
      - ./backend/services/auth/.env
    environment:
      PORT: "5001"
      NODE_ENV: production
      MONGODB_URL: mongodb://mongo:27017/auth
      MONGO_URI: mongodb://mongo:27017/auth
      MONGODB_URI: mongodb://mongo:27017/auth
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5001:5001"
    networks:
      - solvix-network

  chat:
    build:
      context: ./backend
      dockerfile: services/chat/Dockerfile
    container_name: solvix-chat
    restart: unless-stopped
    env_file:
      - ./backend/services/chat/.env
    environment:
      PORT: "5002"
      NODE_ENV: production
      MONGODB_URL: mongodb://mongo:27017/chat
      MONGO_URI: mongodb://mongo:27017/chat
      MONGODB_URI: mongodb://mongo:27017/chat
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5002:5002"
    networks:
      - solvix-network

  agent:
    build:
      context: ./backend
      dockerfile: services/agent/Dockerfile
    container_name: solvix-agent
    restart: unless-stopped
    env_file:
      - ./backend/services/agent/.env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      PORT: "5003"
      NODE_ENV: production
      NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
      MONGODB_URL: mongodb://mongo:27017/agent
      MONGO_URI: mongodb://mongo:27017/agent
      MONGODB_URI: mongodb://mongo:27017/agent
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5003:5003"
    networks:
      - solvix-network

  resume:
    build:
      context: ./backend
      dockerfile: services/Resume/Dockerfile
    container_name: solvix-resume
    restart: unless-stopped
    env_file:
      - ./backend/services/Resume/.env
    environment:
      PORT: "5004"
      NODE_ENV: production
      MONGODB_URL: mongodb://mongo:27017/resume
      MONGO_URI: mongodb://mongo:27017/resume
      MONGODB_URI: mongodb://mongo:27017/resume
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5004:5004"
    networks:
      - solvix-network

  portfolio:
    build:
      context: ./backend
      dockerfile: services/portfolio/Dockerfile
    container_name: solvix-portfolio
    restart: unless-stopped
    env_file:
      - ./backend/services/portfolio/.env
    environment:
      PORT: "5005"
      NODE_ENV: production
      MONGODB_URL: mongodb://mongo:27017/portfolio
      MONGO_URI: mongodb://mongo:27017/portfolio
      MONGODB_URI: mongodb://mongo:27017/portfolio
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5005:5005"
    networks:
      - solvix-network

  billing:
    build:
      context: ./backend
      dockerfile: services/billing/Dockerfile
    container_name: solvix-billing
    restart: unless-stopped
    env_file:
      - ./backend/services/billing/.env
    environment:
      PORT: "5006"
      NODE_ENV: production
      MONGODB_URL: mongodb://mongo:27017/billing
      MONGO_URI: mongodb://mongo:27017/billing
      MONGODB_URI: mongodb://mongo:27017/billing
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5006:5006"
    networks:
      - solvix-network

  mock-interview:
    build:
      context: ./backend
      dockerfile: services/mock-Interview/Dockerfile
    container_name: solvix-mock-interview
    restart: unless-stopped
    env_file:
      - ./backend/services/mock-Interview/.env
    environment:
      PORT: "5007"
      NODE_ENV: production
      MONGODB_URL: mongodb://mongo:27017/mockinterview
      MONGO_URI: mongodb://mongo:27017/mockinterview
      MONGODB_URI: mongodb://mongo:27017/mockinterview
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5007:5007"
    networks:
      - solvix-network

  gateway:
    build:
      context: ./backend
      dockerfile: gateway/Dockerfile
    container_name: solvix-gateway
    restart: unless-stopped
    env_file:
      - ./backend/gateway/.env
    environment:
      PORT: "5000"
      NODE_ENV: production

      Auth_Services: http://auth:5001
      Chat_Services: http://chat:5002
      Agent_Services: http://agent:5003
      Resume_Services: http://resume:5004
      PORTFOLIO_SERVICES: http://portfolio:5005
      BILLING_SERVICES: http://billing:5006
      MOCK_INTERVIEW_SERVICES: http://mock-interview:5007

      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"

      FRONTEND_URL: http://localhost
    depends_on:
      - auth
      - chat
      - agent
      - resume
      - portfolio
      - billing
      - mock-interview
      - redis
    ports:
      - "5000:5000"
    networks:
      - solvix-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SERVER_URL: /api
    container_name: solvix-frontend
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "80:80"
    networks:
      - solvix-network

networks:
  solvix-network:
    driver: bridge

volumes:
  mongo_data:
  redis_data: